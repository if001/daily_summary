[project]
name = "daily-report-agent"
version = "0.1.0"
description = "Daily report agent built with LangGraph and Ollama"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0.0",
  "langgraph>=1.0.0",
  "langchain-ollama>=0.3.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "feedparser>=6.0.11",
  "python-dotenv>=1.2.2",
]

[project.scripts]
daily-report-agent = "daily_report_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
