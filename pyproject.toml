[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-topic-collector"
version = "0.1.0"
description = "Collect topic-filtered daily entries from arXiv, Hacker News, Reddit, and Hatena Bookmark."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
daily-topic-collector = "daily_topic_collector.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
